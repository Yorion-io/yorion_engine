[package]
name = "yorion_engine"
version = "0.4.1"
edition = "2021"
authors = ["Umesh Shrestha <umesh@yorion.io>"]
description = "Nepali (Bikram Sambat) calendar engine: BS/AD conversion, panchanga (tithi, nakshatra, yoga, karana) and festival recurrence"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Yorion-io/yorion_engine"
homepage = "https://github.com/Yorion-io/yorion_engine"
documentation = "https://docs.rs/yorion_engine"
readme = "../README.md"
keywords = ["bikram-sambat", "nepali-calendar", "panchanga", "tithi", "calendar"]
categories = ["date-and-time", "wasm"]
rust-version = "1.82"

[lib]
name = "yorion_engine"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "wasmbind", "clock"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
thiserror = "2.0"
suncalc = "0.3.0"
serde_json = "1.0"

# WASM dependencies
wasm-bindgen = { version = "=0.2.122", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
js-sys = { version = "0.3", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

# UniFFI for native bindings (Swift, Kotlin, etc.)
uniffi = { version = "0.28", optional = true }



[features]
default = []
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys", "getrandom/js"]
uniffi-bindings = ["uniffi"]
uniffi-cli = ["uniffi-bindings", "uniffi/cli"]

[dev-dependencies]
# Reference implementation that src/services/ephemeris.rs is tested against, bit for bit.
astro = "2.0.0"
# Reference implementation that src/domain/recurrence/ad_expander.rs is tested against.
rrule = { version = "0.14.0", default-features = false }
proptest = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

# Only built when generating foreign-language bindings; without this,
# `cargo install yorion_engine` would install a binary that just prints an error.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[[bench]]
name = "engine_perf"
harness = false

[build-dependencies]
serde_json = "1.0"
chrono = "0.4"
uniffi = { version = "0.28", features = ["build"], optional = true }


[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Used for the Python wheels (see python/pyproject.toml). UniFFI's library-mode
# binding generator reads interface metadata from the library's symbols, which
# `strip = true` above removes, leaving an empty Python module.
[profile.python-release]
inherits = "release"
strip = false

# The differential test in tests/ad_rrule_differential.rs spends nearly all its
# time inside `rrule` (the reference); optimising just that dev-dependency keeps
# the debug test run short.
[profile.dev.package.rrule]
opt-level = 3
